<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AQUADROP AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--g:#2e7d32;--b:#0277bd;--bg:#f2f7f3;--c:#fff;--t:#1b2a22;--m:#5f7268;--r:#c62828;--o:#ef6c00}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
nav{width:200px;background:linear-gradient(180deg,#1b5e20,#01579b);color:#fff;padding:16px 8px;flex-shrink:0}
nav h1{font-size:18px;margin:0 8px 16px}nav a{display:block;padding:10px 12px;border-radius:8px;color:#e8f5e9;cursor:pointer;font-size:14px}nav a.on,nav a:hover{background:rgba(255,255,255,.2)}
main{flex:1;padding:18px;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--c);border-radius:12px;padding:14px;box-shadow:0 1px 4px #0001;margin-bottom:12px;overflow-x:auto}.kpi b{display:block;font-size:24px;color:var(--g)}.kpi span{color:var(--m);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid #e3ebe5;text-align:left}
button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;margin:2px}button.b{background:var(--b)}button.r{background:var(--r)}button.o{background:var(--o)}
input,select{padding:6px;border:1px solid #bcc9c0;border-radius:6px;width:90px}.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#e1f0ff;color:#01579b}.sim{background:#fff3e0;color:#e65100}
.hi{color:var(--r);font-weight:700}.md{color:var(--o);font-weight:700}#msg{position:fixed;right:12px;bottom:12px;padding:10px 14px;border-radius:8px;color:#fff;display:none}
.bar{height:10px;background:#dfe9e2;border-radius:5px}.bar i{display:block;height:10px;border-radius:5px;background:var(--b)}
@media(max-width:700px){body{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:6px}nav h1{display:none}nav a{white-space:nowrap}}
</style></head><body>
<nav><h1>💧 AQUADROP AI</h1></nav><main><div id="page">Loading…</div></main><div id="msg"></div>
<script>
const PAGES=["Overview","Zones","AI Prediction","Allocation","Irrigation","Water","Alerts","Settings"];let cur="Overview",S=null,charts={},busy=false;
const nav=document.querySelector("nav");PAGES.forEach(p=>{const a=document.createElement("a");a.textContent=p;a.onclick=()=>{cur=p;draw()};nav.appendChild(a)});
const $=(h)=>h,f=(n,d=1)=>Number(n).toFixed(d),SIM='<span class="tag sim">SIMULATED</span>',ALG='<span class="tag">ALGORITHM</span>';
function toast(t,ok=true){const m=document.getElementById("msg");m.textContent=t;m.style.background=ok?"#2e7d32":"#c62828";m.style.display="block";setTimeout(()=>m.style.display="none",3500)}
async function api(path,method="GET",body){try{const o={method,headers:{}};if(body instanceof FormData)o.body=body;else if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
const r=await fetch("/api/"+path,o);const j=await r.json();if(!r.ok)throw new Error(j.detail||r.statusText);return j}catch(e){toast(e.message,false);throw e}}
async function act(path,body,msg){try{await api(path,"POST",body??{});if(msg)toast(msg);await load()}catch(e){}}
async function load(){S=await api("state");draw()}
function chart(id,cfg){if(charts[id]){charts[id].data=cfg.data;charts[id].update("none");return}const c=document.getElementById(id);if(c&&window.Chart)charts[id]=new Chart(c,cfg)}
function kpi(l,v){return `<div class="card kpi"><b>${v}</b><span>${l}</span></div>`}
function alertsTbl(a){return a.length?`<table><tr><th>Sev</th><th>Zone</th><th>Time</th><th>Alert</th><th>Possible cause (unconfirmed)</th><th>Inspect</th><th>Status</th></tr>${a.slice().reverse().map(x=>`<tr><td class="${x.severity=="high"?"hi":"md"}">${x.severity}</td><td>${x.zone_id||"tank"}</td><td>${x.timestamp}</td><td>${x.description}</td><td>${x.possible_cause}</td><td>${x.suggested_inspection}</td><td>${x.status}${x.status=="active"?` <button onclick="act('alerts/${x.id}/resolve')">resolve</button>`:""}</td></tr>`).join("")}</table>`:"No alerts."}
const V={
Overview(){const z=S.zones,act=z.filter(x=>x.valve).length,pr=S.alloc?.zones.find(x=>x.rank==1);charts={};
return `<h2>Overview ${SIM}</h2><div class="grid">${kpi("Zones",z.length)}${kpi("Avg soil moisture %",f(z.reduce((a,x)=>a+x.moisture,0)/z.length))}${kpi("Tank (L)",f(S.tank_l,0)+" / "+S.capacity_l)}${kpi("Water used (L)",f(z.reduce((a,x)=>a+x.total_used_l,0),0))}${kpi("Pump",S.pump?"ON":"OFF")}${kpi("Zones irrigating",act)}${kpi("Priority zone",pr?pr.name:"–")}${kpi("Mode",S.mode)}</div>
<div class="card"><b>Zones</b><table><tr><th>Zone</th><th>Crop</th><th>Moisture %</th><th>Status</th><th>Valve</th></tr>${z.map(x=>`<tr><td>${x.name}</td><td>${x.crop}</td><td><div class="bar"><i style="width:${x.moisture}%"></i></div>${f(x.moisture)} (threshold ${x.threshold})</td><td>${x.status}</td><td>${x.valve?"OPEN":"closed"}</td></tr>`).join("")}</table></div>
<div class="card"><b>Recent alerts</b>${alertsTbl(S.alerts.slice(-3))}</div><div class="card"><canvas id="c1" height="90"></canvas></div>`},
Zones(){return `<h2>Zone management</h2><div class="card"><table><tr><th>Name</th><th>Crop</th><th>Soil</th><th>Area m²</th><th>Threshold %</th><th>Target %</th><th>Sensitivity 0-1</th><th></th></tr>${S.zones.map(z=>`<tr id="z${z.id}"><td><input data-k=name value="${z.name}"></td><td><input data-k=crop value="${z.crop}"></td><td><select data-k=soil>${["Sandy","Loam","Clay"].map(s=>`<option ${s==z.soil?"selected":""}>${s}</option>`).join("")}</select></td><td><input data-k=area value="${z.area}"></td><td><input data-k=threshold value="${z.threshold}"></td><td><input data-k=target value="${z.target}"></td><td><input data-k=sensitivity value="${z.sensitivity}"></td><td><button onclick="saveZone(${z.id})">Save</button></td></tr>`).join("")}</table></div>
<div class="card"><b>Irrigation sessions</b><table><tr><th>Zone</th><th>Start (min)</th><th>End</th><th>Allocated L</th><th>Delivered L</th><th>Moisture before→after</th><th>Ended by</th></tr>${S.sessions.slice().reverse().map(s=>`<tr><td>${s.zone_id}</td><td>${s.start_min}</td><td>${s.end_min}</td><td>${s.allocated_l}</td><td>${s.delivered_l}</td><td>${f(s.moisture_before)}→${s.moisture_after??"soaking"}</td><td>${s.reason}</td></tr>`).join("")||"<tr><td>none yet</td></tr>"}</table></div>`},
"AI Prediction"(){const m=S.model,d=S.dataset;return `<h2>AI prediction</h2><div class="card"><b>Model status</b><p>${m?`${m.model} · trained on <b>${m.source}</b> (${m.rows} rows) · features: ${m.features.join(", ")}<br>Accuracy ${f(m.metrics.accuracy,3)} · Precision ${f(m.metrics.precision,3)} · Recall ${f(m.metrics.recall,3)} · F1 ${f(m.metrics.f1,3)} · confusion matrix ${JSON.stringify(m.metrics.confusion_matrix)}<br><i>${m.note}</i>`:"<b>No trained model.</b> Predictions use a labelled rule-based fallback, not ML."}</p>
<button onclick="act('train',{},'Trained on synthetic data')">Train on SYNTHETIC demo data</button>${m?.source.includes("synthetic")?"<p class=hi>Synthetic data: metrics only prove the pipeline works.</p>":""}</div>
<div class="card"><b>Upload your CSV</b> <input type=file id=fu accept=".csv" style="width:auto"><button class=b onclick="upload()">Upload</button>
${d?`<p>${d.name}: ${d.rows} rows · ${d.origin} · missing values: ${JSON.stringify(d.missing)}</p><div style="overflow:auto"><table><tr>${d.columns.map(c=>`<th>${c}</th>`).join("")}</tr>${d.preview.map(r=>`<tr>${d.columns.map(c=>`<td>${r[c]}</td>`).join("")}</tr>`).join("")}</table></div>
<p>Map columns (leave blank if absent): ${["moisture","temperature","humidity"].map(k=>`${k}: <select id="m_${k}"><option value="">–</option>${d.columns.map(c=>`<option>${c}</option>`).join("")}</select>`).join(" ")} · Target (2 classes): <select id=tgt>${d.columns.map(c=>`<option>${c}</option>`).join("")}</select> <button onclick="trainUp()">Train on upload</button></p>`:""}</div>
<div class="card"><button class=b onclick="act('predict',{},'Predictions updated')">Predict for all zones</button><table><tr><th>Zone</th><th>Irrigate?</th><th>P(irrigate)</th><th>Source (prediction, not measurement)</th></tr>${Object.entries(S.preds).map(([k,p])=>`<tr><td>${k}</td><td>${p.irrigate?"YES":"no"}</td><td>${p.probability??"–"}</td><td>${p.source}</td></tr>`).join("")}</table></div>`},
Allocation(){const a=S.alloc,w=S.weights;charts={};return `<h2>Water allocation ${ALG}</h2><div class="card">Weights (deficit / sensitivity / ML): <input id=w1 value="${a?a.weights.deficit:.5}"> <input id=w2 value="${a?a.weights.sensitivity:.3}"> <input id=w3 value="${a?a.weights.ml:.2}"> <button onclick="runAlloc()">Allocate water</button></div>
${a?`<div class="grid">${kpi("Available L",a.available_l)}${kpi("Total demand L",a.total_demand_l)}${kpi("Allocated L",a.total_allocated_l)}${kpi("Unmet L",a.total_unmet_l)}</div><div class="card"><table><tr><th>Rank</th><th>Zone</th><th>Demand L</th><th>Score</th><th>Allocated L</th><th>Unmet L</th><th>Why</th></tr>${a.zones.slice().sort((x,y)=>(x.rank||9)-(y.rank||9)).map(r=>`<tr><td>${r.rank??"–"}</td><td>${r.name}</td><td>${r.demand_l}</td><td>${r.priority_score}</td><td>${r.allocated_l}</td><td>${r.unmet_l}</td><td>${r.reason}</td></tr>`).join("")}</table></div><div class="card"><canvas id=c2 height=80></canvas></div>`:"<div class=card>Press Allocate water.</div>"}`},
Irrigation(){return `<h2>Irrigation control ${SIM}</h2><div class="card">Mode: <button class="${S.mode=="auto"?"":"b"}" onclick="act('mode',{mode:'auto'})">Auto</button><button class="${S.mode=="manual"?"":"b"}" onclick="act('mode',{mode:'manual'})">Manual</button> · Pump: <b>${S.pump?"ON":"OFF"}</b>
<br><button onclick="act('irrigation/start',{},'Irrigation started')">Start (use allocation)</button><button class=r onclick="act('irrigation/stop',{},'Stopped')">Stop all</button><p>Auto mode runs predict → prioritise → allocate → irrigate whenever a zone drops below its threshold.</p></div>
<div class="card"><table><tr><th>Zone</th><th>Valve</th><th>Status</th><th>Allocated L</th><th>Delivered L</th><th>Flow L/min</th><th>Manual start (L)</th></tr>${S.zones.map(z=>`<tr><td>${z.name}</td><td>${z.valve?"OPEN":"closed"}</td><td>${z.status}</td><td>${f(z.allocated_l,0)}</td><td>${f(z.delivered_l)}</td><td>${f(z.last_flow_lpm)}</td><td><input id="l${z.id}" value=100><button onclick="act('irrigation/start',{zone_id:${z.id},litres:+document.getElementById('l${z.id}').value})">Start</button></td></tr>`).join("")}</table></div>
<div class="card"><b>Inject a SIMULATED fault (to test detection)</b><br>${S.zones.map(z=>`${z.name}: <button class=o onclick="act('fault',{zone_id:${z.id},kind:'clog',value:0.3},'Clog injected')">clog</button><button class=o onclick="act('fault',{zone_id:${z.id},kind:'leak',value:0.6},'Leak injected')">leak</button><button class=o onclick="act('fault',{zone_id:${z.id},kind:'valve_fault',value:true},'Valve fault injected')">valve stuck</button><button onclick="clearF(${z.id})">clear</button><br>`).join("")}</div>`},
Water(){charts={};return `<h2>Water monitoring ${SIM}</h2><div class="grid">${kpi("Tank L",f(S.tank_l,0))}${kpi("Tank %",f(100*S.tank_l/S.capacity_l,0))}</div><div class="card"><canvas id=c1 height=90></canvas></div><div class="card"><canvas id=c3 height=70></canvas></div>`},
Alerts(){return `<h2>Alerts & fault detection</h2><p>Rule-based flags only. They indicate something to inspect, not a confirmed diagnosis.</p><div class="card">${alertsTbl(S.alerts)}</div>`},
Settings(){const w=S.weather,c=S.cfg;return `<h2>Settings</h2><div class="card"><b>Weather</b> — ${w.source}: ${f(w.temperature)}°C, ${f(w.humidity,0)}% RH, rain ${w.rain_mm} mm<br>Manual: temp <input id=wt value=${w.temperature}> humidity <input id=wh value=${w.humidity}> rain mm <input id=wr value=${w.rain_mm}> <button onclick="act('weather',{temperature:+wt.value,humidity:+wh.value,rain_mm:+wr.value},'Weather set')">Apply</button><br><small>Set OPENWEATHER_API_KEY in the .env file to use live weather.</small></div>
<div class="card"><b>Simulation</b> flow L/min <input id=sf value=${c.flow_lpm}> evaporation %/min <input id=se value=${c.evap_pct_per_min}> soak time min <input id=si value=${c.infiltration_min}> sim-minutes per 2s <input id=sp value=${S.speed}> tank L <input id=st value=${f(S.tank_l,0)}> <button onclick="act('settings',{flow_lpm:+sf.value,evap_pct_per_min:+se.value,infiltration_min:+si.value,speed:+sp.value,tank_l:+st.value},'Saved')">Save</button></div>
<div class="card"><button class=r onclick="act('reset',{},'Simulation reset')">Reset demo</button></div>`}};
function draw(){document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.textContent==cur));if(!S)return;const ae=document.activeElement;if(ae&&["INPUT","SELECT"].includes(ae.tagName)&&cur!="Overview"&&cur!="Water")return;
const el=document.getElementById("page");el.innerHTML=V[cur]();const h=S.history;
if(cur=="Overview"||cur=="Water")chart("c1",{type:"line",data:{labels:h.map(x=>x.t),datasets:[{label:"Tank (L) – simulated",data:h.map(x=>x.tank),borderColor:"#0277bd",pointRadius:0}]},options:{animation:false}});
if(cur=="Water")chart("c3",{type:"bar",data:{labels:S.zones.map(z=>z.name),datasets:[{label:"Water used per zone (L) – simulated",data:S.zones.map(z=>z.total_used_l),backgroundColor:"#2e7d32"}]},options:{animation:false}});
if(cur=="Allocation"&&S.alloc){const z=S.alloc.zones;chart("c2",{type:"bar",data:{labels:z.map(r=>r.name),datasets:[{label:"Demand L",data:z.map(r=>r.demand_l),backgroundColor:"#90caf9"},{label:"Allocated L",data:z.map(r=>r.allocated_l),backgroundColor:"#2e7d32"}]},options:{animation:false}})}}
async function saveZone(id){const b={};document.querySelectorAll(`#z${id} [data-k]`).forEach(e=>b[e.dataset.k]=e.value);try{await api("zones/"+id,"PUT",b);toast("Zone saved");await load()}catch(e){}}
async function runAlloc(){await act("allocate",{weights:{deficit:+w1.value,sensitivity:+w2.value,ml:+w3.value}},"Allocation done")}
async function upload(){const fl=document.getElementById("fu").files[0];if(!fl)return toast("Choose a CSV first",false);const fd=new FormData();fd.append("file",fl);try{await api("upload","POST",fd);toast("Uploaded");await load()}catch(e){}}
async function trainUp(){const fm={};["moisture","temperature","humidity"].forEach(k=>{const v=document.getElementById("m_"+k).value;if(v)fm[k]=v});await act("train",{use_uploaded:true,feature_map:fm,target:document.getElementById("tgt").value},"Model trained on your upload")}
async function clearF(id){for(const [k,v] of [["clog",1],["leak",0],["valve_fault",false]])await api("fault","POST",{zone_id:id,kind:k,value:v});toast("Faults cleared");load()}
load();setInterval(async()=>{if(busy)return;busy=true;try{await fetch("/api/tick",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});S=await api("state");if(["Overview","Water","Irrigation","Alerts"].includes(cur))draw()}catch(e){}busy=false},2000);
</script></body></html>
